name: attendance-nr
services:
  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: attendance-nr_tunnel
    restart: always
    command: tunnel --no-autoupdate run --url http://host.docker.internal:${PORT:-8081} --token ${CF_TUNNEL_TOKEN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - CF_TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
      - PORT=${PORT:-5001}
    networks:
      - attendance_nr_net
networks:
  attendance_nr_net:
    name: attendance_nr_net
